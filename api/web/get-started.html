<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started — Verdant</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page bg-mesh">
  <div class="auth-box">
    <a href="index.html" class="auth-logo">
      <span class="logo-icon" style="width:36px;height:36px;border-radius:12px;background:var(--brand-500);display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </span>
      <span class="logo-text">Verdant</span>
    </a>

    <div class="auth-card">
      <div id="form-view">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-sub">Join Verdant and start saving energy today.</p>

        <form id="get-started-form" novalidate>
          <div class="form-group">
            <div class="field">
              <label for="username">Username</label>
              <input id="username" type="text" placeholder="e.g. johndoe" autocomplete="username" autofocus>
              <span class="error-msg" id="username-error" style="display:none;"></span>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="Min. 8 characters" autocomplete="new-password">
              <span class="hint">At least 8 characters</span>
              <span class="error-msg" id="password-error" style="display:none;"></span>
            </div>
            <div class="field">
              <label for="confirm">Confirm Password</label>
              <input id="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password">
              <span class="error-msg" id="confirm-error" style="display:none;"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-full" id="submit-btn">
              <span id="submit-text">Create Account</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </div>
        </form>

        <p class="auth-footer">Already have an account? <a href="sign-in.html">Sign in</a></p>
      </div>

      <div id="success-view" class="success-box" style="display:none;">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--brand-500)" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <h2 style="font-size:24px;font-weight:700;">Welcome to Verdant!</h2>
        <p style="color:var(--gray-500);">Your account has been created. Redirecting you now&hellip;</p>
      </div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
const form = document.getElementById("get-started-form");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirm");
const submitBtn = document.getElementById("submit-btn");
const submitText = document.getElementById("submit-text");

function clearErrors() {
  ["username", "password", "confirm"].forEach((id) => {
    document.getElementById(id).classList.remove("error");
    document.getElementById(id + "-error").style.display = "none";
  });
}
function showFieldError(id, message) {
  document.getElementById(id).classList.add("error");
  const el = document.getElementById(id + "-error");
  el.textContent = message;
  el.style.display = "block";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearErrors();
  let hasError = false;
  const username = usernameInput.value.trim();
  const password = passwordInput.value;
  const confirm = confirmInput.value;

  if (!username) { showFieldError("username", "Username is required."); hasError = true; }
  else if (username.length < 3) { showFieldError("username", "Username must be at least 3 characters."); hasError = true; }
  else if (userExists(username)) { showFieldError("username", "That username is already taken."); hasError = true; }

  if (!password) { showFieldError("password", "Password is required."); hasError = true; }
  else if (password.length < 8) { showFieldError("password", "Password must be at least 8 characters."); hasError = true; }

  if (!confirm) { showFieldError("confirm", "Please confirm your password."); hasError = true; }
  else if (password !== confirm) { showFieldError("confirm", "Passwords do not match."); hasError = true; }

  if (hasError) return;

  submitBtn.disabled = true;
  submitText.textContent = "Creating account...";
  await new Promise((r) => setTimeout(r, 700));

  createUser(username, password);
  setSession(username);

  document.getElementById("form-view").style.display = "none";
  document.getElementById("success-view").style.display = "flex";

  setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
});
</script>
</body>
</html>
