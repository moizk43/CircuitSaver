<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Get Started — Circuit Saver</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page bg-mesh">
  <div class="auth-box">
    <a href="index.html" class="auth-logo">
      <img src="logo.png" alt="Circuit Saver Logo" style="width:120px;height:120px;" text="Circuit Saver">
    </a>

    <div class="auth-card">
      <div id="form-view">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-sub">Join Circuit Saver and start saving energy today.</p>

        <form id="get-started-form" novalidate>
          <div class="form-group">
            <div class="field">
              <label for="username">Email</label>
              <input id="username" type="email" placeholder="you@example.com" autocomplete="email" autofocus>
              <span class="error-msg" id="username-error" style="display:none;"></span>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="Min. 8 characters" autocomplete="new-password">
              <span class="hint">At least 8 characters</span>
              <span class="error-msg" id="password-error" style="display:none;"></span>
            </div>
            <div class="field">
              <label for="confirm">Confirm Password</label>
              <input id="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password">
              <span class="error-msg" id="confirm-error" style="display:none;"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-full" id="submit-btn">
              <span id="submit-text">Create Account</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </div>
        </form>

        <p class="auth-footer">Already have an account? <a href="sign-in.html">Sign in</a></p>
      </div>

      <div id="success-view" class="success-box" style="display:none;">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--brand-500)" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <h2 style="font-size:24px;font-weight:700;">Welcome to Verdant!</h2>
        <p style="color:var(--gray-500);">Your account has been created. Redirecting you now&hellip;</p>
      </div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
const form = document.getElementById("get-started-form");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirm");
const submitBtn = document.getElementById("submit-btn");
const submitText = document.getElementById("submit-text");

function clearErrors() {
  ["username", "password", "confirm"].forEach((id) => {
    document.getElementById(id).classList.remove("error");
    document.getElementById(id + "-error").style.display = "none";
  });
}
function showFieldError(id, message) {
  document.getElementById(id).classList.add("error");
  const el = document.getElementById(id + "-error");
  el.textContent = message;
  el.style.display = "block";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearErrors();

  let hasError = false;
  const email = usernameInput.value.trim();
  const password = passwordInput.value;
  const confirm = confirmInput.value;

  if (!email) {
    showFieldError("username", "Email is required.");
    hasError = true;
  } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showFieldError("username", "Enter a valid email address.");
    hasError = true;
  }

  if (!password) {
    showFieldError("password", "Password is required.");
    hasError = true;
  } else if (password.length < 8) {
    showFieldError("password", "Password must be at least 8 characters.");
    hasError = true;
  }

  if (!confirm) {
    showFieldError("confirm", "Please confirm your password.");
    hasError = true;
  } else if (password !== confirm) {
    showFieldError("confirm", "Passwords do not match.");
    hasError = true;
  }

  if (hasError) return;

  submitBtn.disabled = true;
  submitText.textContent = "Creating account...";
  await new Promise((r) => setTimeout(r, 400));

  try {
    const result = await signUpUser(email, password);

    if (result.needs_confirmation) {
      window.location.href = "sign-in.html?confirm=1&email=" + encodeURIComponent(result.email);
      return;
    }

    setSession(result.email, result.access_token);

    document.getElementById("form-view").style.display = "none";
    document.getElementById("success-view").style.display = "flex";

    setTimeout(() => {
      if (isAdminEmail(result.email)) {
        window.location.href = "admin.html";
      } else {
        window.location.href = "dashboard.html";
      }
    }, 1200);
  } catch (err) {
    submitBtn.disabled = false;
    submitText.textContent = "Create Account";

    if (err.message && err.message.toLowerCase().includes("already exists")) {
      showFieldError("username", "An account with this email already exists. Try signing in instead.");
    } else if (err.message && err.message.toLowerCase().includes("already registered")) {
      showFieldError("username", "An account with this email already exists. Try signing in instead.");
    } else {
      showFieldError("username", err.message || "Signup failed. Please try again.");
    }
  }
});
</script>
</body>
</html>
