<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Get Started — Circuit Saver</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-logo">
      <span class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></span>
      Circuit Saver
    </a>

    <div id="form-view">
      <h1 class="text-h1 auth-title">Create your account</h1>
      <p class="text-body auth-sub">Join Circuit Saver and see your household's grid impact.</p>

      <form id="get-started-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="username" autofocus>
          <span class="error-msg" id="email-error"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Min. 8 characters" autocomplete="new-password">
          <span class="hint">At least 8 characters</span>
          <span class="error-msg" id="password-error"></span>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password">
          <span class="error-msg" id="confirm-error"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-full" id="submit-btn">
          <span id="submit-text">Create account</span>
        </button>
      </form>
      <p class="auth-footer">Already have an account? <a href="sign-in.html">Sign in</a></p>
    </div>

    <div id="success-view" class="success-box" style="display:none;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--brand-500)" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <h2 class="text-h2">Welcome to Circuit Saver!</h2>
      <p class="text-body">Your account has been created. Redirecting you now&hellip;</p>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  const form = document.getElementById("get-started-form");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const confirmInput = document.getElementById("confirm");
  const submitBtn = document.getElementById("submit-btn");
  const submitText = document.getElementById("submit-text");

  function clearErrors() {
    ["email", "password", "confirm"].forEach((id) => {
      document.getElementById(id).classList.remove("error");
      document.getElementById(id + "-error").textContent = "";
    });
  }
  function showFieldError(id, message) {
    document.getElementById(id).classList.add("error");
    document.getElementById(id + "-error").textContent = message;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors();
    let hasError = false;
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirm = confirmInput.value;

    if (!email) { showFieldError("email", "Email is required."); hasError = true; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showFieldError("email", "Enter a valid email address."); hasError = true; }

    if (!password) { showFieldError("password", "Password is required."); hasError = true; }
    else if (password.length < 8) { showFieldError("password", "Password must be at least 8 characters."); hasError = true; }

    if (!confirm) { showFieldError("confirm", "Please confirm your password."); hasError = true; }
    else if (password !== confirm) { showFieldError("confirm", "Passwords do not match."); hasError = true; }

    if (hasError) return;

    submitBtn.disabled = true;
    submitText.textContent = "Creating account…";

    try {
      const result = await window.signUpUser(email, password);

      if (result.needs_confirmation) {
        window.location.href = "sign-in.html?confirm=1&email=" + encodeURIComponent(result.email);
        return;
      }

      window.setSession(result.email, result.access_token);
      document.getElementById("form-view").style.display = "none";
      document.getElementById("success-view").style.display = "flex";
      document.getElementById("success-view").style.flexDirection = "column";
      document.getElementById("success-view").style.alignItems = "center";
      setTimeout(() => {
        window.location.href = window.isAdminEmail(result.email) ? "admin.html" : "dashboard.html";
      }, 1200);
    } catch (err) {
      submitBtn.disabled = false;
      submitText.textContent = "Create account";
      showFieldError("email", err.message);
    }
  });
</script>
</body>
</html>
